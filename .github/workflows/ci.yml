name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Type-check (strict)
        # mypy runs on src/ only — tests are not type-checked at strict level
        run: mypy src

      - name: Tests
        # The suite runs fully offline against in-memory mocks — no external services or secrets.
        run: pytest

      - name: Validate PR artifacts
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/validate_pr.cjs
